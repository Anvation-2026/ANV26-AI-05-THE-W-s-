name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Browser end-to-end (no back end)
        run: |
          npx playwright install --with-deps chromium
          CHROME_CHANNEL=chromium npm run e2e

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: signaltwin-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: signaltwin-api/pyproject.toml
      - name: Install (CPU-only PyTorch keeps this fast)
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[vision,dev]"
      - run: ruff check src tests
      - run: mypy src
      - name: Tests, including golden parity with the browser engine
        run: pytest -m "not real_yolo"

  api-yolo:
    runs-on: ubuntu-latest
    needs: api
    defaults:
      run:
        working-directory: signaltwin-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[vision,dev]"
          mkdir -p models && curl -fsSL -o models/yolo11n.pt https://github.com/ultralytics/assets/releases/download/v8.4.0/yolo11n.pt
      - name: Real model smoke test
        run: pytest -m real_yolo

  e2e-backend:
    runs-on: ubuntu-latest
    needs: [web, api]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m venv signaltwin-api/.venv
          signaltwin-api/.venv/bin/pip install -e "signaltwin-api[vision]"
      - run: npm ci
      - name: Browser end-to-end with the real back end
        run: |
          npx playwright install --with-deps chromium
          CHROME_CHANNEL=chromium npm run e2e:backend
