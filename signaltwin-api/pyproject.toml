[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "signaltwin-api"
version = "0.1.0"
description = "SignalTwin back end: video perception, demand estimation and simulation behind a REST and SSE API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "python-multipart>=0.0.9",
  "numpy>=1.26",
  "av>=12",
  "opencv-python-headless>=4.9",
  "orjson>=3.10",
  "psutil>=5.9",
]

[project.optional-dependencies]
vision = ["ultralytics>=8.3", "supervision>=0.22,<0.31"]
supabase = ["supabase>=2.5"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "hypothesis>=6.100", "ruff>=0.5", "mypy>=1.10", "jsonschema>=4.22", "pglast>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q -m 'not real_yolo'"
markers = ["real_yolo: runs the real detector, needs the vision extras and weights", "slow: takes more than a few seconds"]

[tool.ruff]
line-length = 120
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]